name: scrape goods

on:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm scrape
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/data/goods.json
          git diff --cached --quiet || git commit -m "chore : 굿즈 데이터 자동 갱신 $(date -u +%F)"
          git push
